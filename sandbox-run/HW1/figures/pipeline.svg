<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="40" y="34" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#111">一次请求在 SGLang 在线推理框架中的完整流程</text>
  <text x="40" y="54" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" fill="#555">client → tokenizer → scheduler / queue → prefill → KV Cache / RadixCache → decode iterations → sampling → streaming output → metric</text>
  <text x="40" y="74" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" fill="#555">（HW1 挑战内容 3）</text>
  <g><rect x="40" y="92" width="240" height="92" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/><text x="160.0" y="116" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#0b3d91">Client</text><text x="160.0" y="132" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#0b3d91">请求</text><text x="160.0" y="172" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">发送 prompt / input_ids</text></g><g><rect x="330" y="92" width="240" height="92" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/><text x="450.0" y="116" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#0b3d91">Tokenizer</text><text x="450.0" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">文本 → token ids</text></g><g><rect x="620" y="92" width="240" height="92" rx="8" fill="#fff4e5" stroke="#f59e0b" stroke-width="1.5"/><text x="740.0" y="116" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#7c4a03">Scheduler</text><text x="740.0" y="132" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#7c4a03">/ Queue</text><text x="740.0" y="172" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">准入控制、组 batch、FCFS/LPM 调度</text></g><g><rect x="620" y="250" width="240" height="92" rx="8" fill="#f3e8fd" stroke="#8b5cf6" stroke-width="1.5"/><text x="740.0" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">Prefill</text><text x="740.0" y="314" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">input_ids → 计算 QKV，写 KV Cache</text><text x="740.0" y="327" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">命中前缀时只算未缓存部分</text></g><g><rect x="330" y="250" width="240" height="92" rx="8" fill="#e8f8ee" stroke="#12a150" stroke-width="1.5"/><text x="450.0" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#0b5132">KV Cache</text><text x="450.0" y="290" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#0b5132">(RadixCache)</text><text x="450.0" y="330" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">page-sized 存储 + radix tree 前缀索引</text></g><g><rect x="40" y="250" width="240" height="92" rx="8" fill="#f3e8fd" stroke="#8b5cf6" stroke-width="1.5"/><text x="160.0" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">Decode</text><text x="160.0" y="290" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">(iterations)</text><text x="160.0" y="330" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">逐步生成，每步只读 KV Cache</text></g><g><rect x="40" y="408" width="240" height="92" rx="8" fill="#f3e8fd" stroke="#8b5cf6" stroke-width="1.5"/><text x="160.0" y="432" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">Sampling</text><text x="160.0" y="472" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">temperature/top_p/seed → 下一个 token</text></g><g><rect x="330" y="408" width="240" height="92" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/><text x="450.0" y="432" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#0b3d91">Streaming</text><text x="450.0" y="448" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#0b3d91">Output</text><text x="450.0" y="488" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">SSE 增量返回（stream_interval）</text></g><g><rect x="620" y="408" width="240" height="92" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/><text x="740.0" y="432" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">Metric</text><text x="740.0" y="472" text-anchor="middle" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#555">TTFT / TPOT / E2E / 命中率 / 吞吐</text></g><line x1="280" y1="138.0" x2="330" y2="138.0" stroke="#555" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="570" y1="138.0" x2="620" y2="138.0" stroke="#555" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="740.0" y1="184" x2="740.0" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="620" y1="296.0" x2="570" y2="296.0" stroke="#555" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="330" y1="296.0" x2="280" y2="296.0" stroke="#555" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="160.0" y1="342" x2="160.0" y2="408" stroke="#555" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="280" y1="454.0" x2="330" y2="454.0" stroke="#555" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="570" y1="454.0" x2="620" y2="454.0" stroke="#555" stroke-width="1.5" marker-end="url(#ah2)"/><path d="M 450.0 342 L 450.0 368 L 26 368 L 26 296.0 L 40 296.0" fill="none" stroke="#12a150" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ah2)"/><text x="458.0" y="364" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="9.5" fill="#0b5132">命中前缀 → 复用 K/V，跳过重算</text>
</svg>